<!doctype html>
<html>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #120c09;
      color: #f3e9dc;
      padding: 32px;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: auto;
        background-color: #1b130d;
        padding: 32px;
        border-radius: 12px;
      "
    >
      <h1 style="color: #e3a567">Study Space</h1>
      <h2>Reset your password</h2>
      <p>We received a request to reset your Study Space password.</p>
      <p>Click the button below to choose a new password.</p>
      <p style="margin: 28px 0">
        <a
          href="{{reset_url}}"
          style="
            background-color: #e3a567;
            color: #120c09;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
          "
        >
          Reset Password
        </a>
      </p>
      <p>If you didn't request this, you can ignore this email.</p>
      <p style="color: #b8a99a; font-size: 12px">
        This link will expire shortly.
      </p>
    </div>
  </body>
</html>
